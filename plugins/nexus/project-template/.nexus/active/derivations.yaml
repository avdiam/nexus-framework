  - id: E-15
    source: "issues-registry `status` vocabulary, written by /nexus-close-issue (Resolved|Rejected), /nexus-work-issue (In-Progress), /nexus-decompose-issue (Decomposed)"
    derived: ".claude/skills/nexus-view-issues/SKILL.md STEP 1 filter (`status IN [Open, In-Progress]`)"
    direction: producer-to-consumer
    runs_at: nexus-registry-cleanup
    disposition: must-check
    first_seen_stale: null
    predicate: |
      # ADDED Conv 7 by the Phase 4/5 independent review, which asked the obvious question the
      # tier's own universal clause invites: SC-03 says "for EVERY registry field an external
      # skill filters on", and the shipped table covered documentation-registry and
      # patterns-registry while ISSUES-REGISTRY - the registry NEXUS reads most - had no row at
      # all. /nexus-view-issues filters it on every invocation. A universal clause with a
      # remembered subset behind it is the same defect the tier exists to catch, one level up.
      r=.nexus/active/registries/issues-registry.yaml
      c=.claude/skills/nexus-view-issues/SKILL.md
      [ -f "$r" ] && [ -f "$c" ] || { echo "ESCALATED: candidates 0 (registry rows) - registry or consumer unreadable"; exit 2; }
      # Comment lines are not rows (E-09's lesson: a registry that documents its own history
      # makes a commented value look live).
      cand=$(grep -vE '^[[:space:]]*#' "$r" | grep -cE '^ISS-[0-9]+\.status:')
      [ "$cand" -eq 0 ] && { echo "ESCALATED: candidates 0 (registry rows with a status field)"; exit 2; }
      present=$(grep -vE '^[[:space:]]*#' "$r" | grep -ohE '^ISS-[0-9]+\.status: "?[A-Za-z-]+' | grep -oE '[A-Za-z-]+$' | sort -u)
      # The consumer states its filter in a table row, not a Scan sentence, so anchor on the
      # bracketed set. Locating the filter and finding it empty are DIFFERENT failures.
      filt=$(grep -ohE 'status IN \[[^]]*\]' "$c" | head -1 | tr -d '[]' | sed 's/status IN //' | tr ',' '\n' | tr -d ' ' | grep '[A-Za-z]' | sort -u)
      [ -n "$filt" ] || { echo "ESCALATED: bound 0 (matched rows) - no filter expression found in the consumer; a filter that cannot be LOCATED is not a filter that matches nothing"; exit 2; }
      bound=0
      for v in $filt; do
        bound=$(( bound + $(grep -vE '^[[:space:]]*#' "$r" | grep -cE "^ISS-[0-9]+\.status: \"?$v\"?[[:space:]]*$") ))
      done
      # EXCLUSIONS MUST BE DECLARED, NOT INFERRED. The first version subtracted ANY value
      # outside the filter from candidates as "excluded by design" - so a producer-side
      # RENAME was absorbed as a deliberate omission and reported clean. Caught by running
      # the fires-on-broken arm (Conv 7): renaming one status produced `0 findings` on a
      # genuinely broken registry. An unknown value is a FINDING; only a value on the
      # declared allow-list is an exclusion. Same shape as E-04's SEEDS/MENUS allow-list.
      # Declared exclusions: the closed states view-issues deliberately omits.
      allow="Resolved Rejected Superseded Decomposed"
      excluded=0; unknown=0
      for v in $present; do
        echo "$filt" | grep -qx "$v" && continue
        rows=$(grep -vE '^[[:space:]]*#' "$r" | grep -cE "^ISS-[0-9]+\.status: \"?$v\"?[[:space:]]*$")
        if echo "$allow" | tr ' ' '\n' | grep -qx "$v"; then
          echo "  status '$v' outside the filter [CLASSIFIED - declared closed state, deliberately omitted]"
          excluded=$(( excluded + rows ))
        else
          unknown=$((unknown+1))
          echo "  status '$v' is in the registry, NOT in the consumer's filter, and NOT a declared exclusion [FINDING] - $rows row(s) invisible to /nexus-view-issues"
        fi
      done
      inscope=$(( cand - excluded ))
      [ "$bound" -eq 0 ] && { echo "ESCALATED: bound 0 < candidates $inscope (in-scope registry rows) - the consumer's filter [$(echo $filt | tr ' ' ',')] matches NO row. Its list would render empty and read as 'no open issues'."; exit 2; }
      [ "$bound" -lt "$inscope" ] && { echo "ESCALATED: bound $bound < candidates $inscope (in-scope registry rows) - the filter reaches only part of the population it should span"; exit 2; }
      echo "FILLED: $unknown findings / $bound bound (in-scope registry rows) / $inscope candidates (in-scope registry rows)"
      echo "  consumer filter: [$(echo $filt | tr ' ' ',')]  registry values: [$(echo $present | tr ' ' ',')]  declared-exclusions: $excluded of $cand total rows"
    fixture: |
      The failure mode is instance 5's on the registry NEXUS reads most: if a producer renamed
      a status (say `Open` -> `Active`) without updating view-issues, the issue list would
      render EMPTY on every invocation and read as "no open issues" - a clean-looking null,
      exactly like staleness-checker matching 0 of 21 guides.
      Fires-on-broken proof (executable today, no git archaeology): rewrite one registry
      `status: "Open"` to `status: "Active"` in a scratch copy and confirm bound drops below
      candidates and the edge ESCALATES.
      Executed Conv 7 on the live tree at declaration - see the Implementation Log.

  - id: E-12
    # ⛔ THIS FIELD IS READ BY A CONSUMER, NOT ONLY BY HUMANS — /nexus-checkpoint STEP 4's reactive
    # freshness scan matches staged paths against it (E-07 was eliminated in its favour). It must
    # therefore stay in lockstep with the predicate below. At Conv 7 the predicate was widened to
    # `.yaml` (review finding #6, so the manifest's own drift could be detected) and THIS FIELD WAS
    # NOT — so a commit touching only `derivations.yaml` would have been counted as drift by the
    # predicate at the next boot while failing to trigger the scan that fixes it. One value, two
    # homes, one updated: this sprint's defect class, in the row that declares it.
    # (Found at the Conv 8 checkpoint, by the intake actually running.)
    source: ".claude/skills/**/*.md + CLAUDE.md + .nexus/templates/*.md + .claude/agents/*.md + .nexus/active/*.md + .nexus/active/*.yaml"
    derived: ".nexus/active/registries/changelog-registry.yaml"
    direction: mtime
    runs_at: boot
    disposition: must-check
    first_seen_stale: null
    predicate: |
      # THE CANDIDATE SET MUST SPAN EVERY SET `n` SCANS. The first draft counted candidates
      # over skills+templates+agents (110) while counting newer files over those PLUS
      # CLAUDE.md PLUS .nexus/active/*.md (113) — two figures counting different things, so
      # `findings` could legally exceed `candidates`. Same category error as E-04's first
      # draft and IE-5, one level down, and it was invisible until E-13's sibling arm printed
      # `108 findings / 106 candidates`. (Found by dogfooding, Conv 7.)
      a=.nexus/active/registries/changelog-registry.yaml
      [ -f "$a" ] || { echo "ESCALATED: candidates 0 (source files) — derived registry missing"; exit 2; }
      cand=$(find .claude/skills .nexus/templates .claude/agents -name '*.md' 2>/dev/null | wc -l)
      cand=$(( cand + $(find CLAUDE.md -name '*.md' 2>/dev/null | wc -l) ))
      cand=$(( cand + $(find .nexus/active -maxdepth 1 \( -name '*.md' -o -name '*.yaml' \) 2>/dev/null | wc -l) ))
      [ "$cand" -eq 0 ] && { echo "ESCALATED: candidates 0 (source files)"; exit 2; }
      # BOUND IS INDEPENDENTLY DERIVED (VC-2 @ 2.9.0): a file is BOUND only if its mtime
      # could actually be compared, i.e. it falls on one side or the other of the -newer
      # partition. A path find cannot stat falls out of BOTH arms, so bound < candidates and
      # the shortfall is reportable. Through v1.3.0 this printed $cand twice.
      newer=$(find .claude/skills .nexus/templates .claude/agents -name '*.md' -newer "$a" 2>/dev/null | wc -l)
      newer=$(( newer + $(find CLAUDE.md -newer "$a" 2>/dev/null | wc -l) ))
      newer=$(( newer + $(find .nexus/active -maxdepth 1 \( -name '*.md' -o -name '*.yaml' \) -newer "$a" 2>/dev/null | wc -l) ))
      older=$(find .claude/skills .nexus/templates .claude/agents -name '*.md' ! -newer "$a" 2>/dev/null | wc -l)
      older=$(( older + $(find CLAUDE.md ! -newer "$a" 2>/dev/null | wc -l) ))
      older=$(( older + $(find .nexus/active -maxdepth 1 \( -name '*.md' -o -name '*.yaml' \) ! -newer "$a" 2>/dev/null | wc -l) ))
      n=$newer; read=$(( newer + older ))
      [ "$read" -lt "$cand" ] && { echo "ESCALATED: bound $read < candidates $cand (source files) — $(( cand - read )) file(s) could not be compared by mtime"; exit 2; }
      [ "$n" -gt "$cand" ] && { echo "ESCALATED: findings $n > candidates $cand (source files) — the two figures were not counted over the same path set"; exit 2; }
      echo "FILLED: $n findings / $read bound (source files) / $cand candidates (source files)"
    fixture: |
      states/ is deliberately excluded from the source set — it changes every checkpoint and
      would keep this edge permanently stale, which is how a warning becomes wallpaper.
      Conv 6: 0 newer (current). Conv 7: 4 newer, correctly detecting THIS ISSUE'S OWN edits
      to nexus-start, nexus-checkpoint, CLAUDE.md and NEXUS-Architecture.md — the mechanism
      firing on the change that built it (PAT-139).
      Fires-on-broken proof: `touch` any skill file and re-run; the count must become non-zero
      (executed Conv 7 — this is the arm that passed on its own, and note that passing was
      never the problem: the DENOMINATOR was wrong while every verdict looked reasonable).
      Denominator arm (added Conv 7): findings must never exceed candidates. Point the edge at
      a very old derived file and confirm `n <= cand`; the pre-fix predicate returned
      `108 findings / 106 candidates` on E-13's identical shape.
      Closed-loop partner: /nexus-checkpoint STEP 4 auto-invokes /nexus-changelog-scan when
      staged paths match this row's source field — boot warns, checkpoint self-heals. As of
      ISS-240 Phase 3.7 checkpoint READS THIS ROW rather than holding its own copy (see E-07).
