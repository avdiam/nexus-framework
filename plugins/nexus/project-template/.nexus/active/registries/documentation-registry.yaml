# documentation-registry.yaml
# Version: 4.0.0 | Date: 2026-08-25 | Sprint: 110
# Purpose: Catalog human-facing documentation guides for /nexus-help (Browse + Learning-path modes),
#          /nexus-staleness-checker, /nexus-guide-creator, and /nexus-dashboard.
#
# ISS-089 Phase 5.1 (Sprint 110): full refresh off disk. Every `references:` entry now carries a REAL
# path and a version read from the target file's own header — the pre-port bare names (NEXUS-CORE.md,
# Bootstrap.md, Analyze.md, Build.md, Maintain.md, learning-extraction.md …) are gone. Verification
# condition: a reference must resolve to a LIVE file. Resolving only into `.nexus/archived/` or
# `.nexus/Sprints/*/archived/` counts as DEAD — eleven of the old entries did exactly that and read as
# "found" to a naive existence check.
#
# DELISTED at Sprint 110 (were `status: planned` since Sprint 061 with `filepath` pointing at nothing):
#   Coverage below is SET-LEVEL (the surviving guide set as a whole), not single-guide equivalence:
#   - infrastructure-setup-guide  → chiefly installation-guide; `memory-first` sits in nexus-framework-guide
#                                   and maintenance-and-evolution-guide; `sonnet-vs-opus` is retired, not moved
#   - system-architecture-guide   → nexus-framework-guide + architecture-quick-guide
#   - data-and-persistence-guide  → spread across 10-11 live guides (registries, state files, two-place)
#   - customization-guide         → GENUINELY UNCOVERED (`behavioral_preferences` scores 0 hits across
#                                   all 15 guides). Recorded as a coverage gap in ISS-246, not as a
#                                   dead registry row.

