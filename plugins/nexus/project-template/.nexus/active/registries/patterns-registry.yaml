# --- PAT-142 ---
PAT-142.name: "bound-the-audit-predicate-both-directions"
PAT-142.file: "patterns/PAT-142.md"
PAT-142.type: methodology
PAT-142.domain: "audit-design"
PAT-142.maturity: emerging
PAT-142.description: "Bound a mechanical audit by enumerating its predicate's two failure directions before running it — the claim-classes no flagged token can reach (too narrow) and the live constructs that share a flagged spelling (too broad). Phrase the exit criterion as 'every hit is fixed or classified', never 'grep returns 0', so the audit cannot pass vacuously or be satisfiable only by corrupting correct files."
PAT-142.use_when:
  - "Authoring a token-based sweep — dead-code removal, deprecated-API purges, secret scanning, banned-word checks, documentation truth-passes"
  - "Writing the exit or success criterion for an audit, especially one phrased as a count reaching zero"
  - "Designing a checklist that mixes grep-shaped detectors with judgment-shaped ones"
  - "An audit reported clean over a corpus nobody believes is clean"
  - "CAUTION: skip for a genuinely closed token set with no live homonyms"
PAT-142.successes: 0
PAT-142.failures: 0
PAT-142.neutral: 0
