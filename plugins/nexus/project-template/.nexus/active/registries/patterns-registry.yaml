PAT-128.name: "boundary-regime-measurement"
PAT-128.file: "patterns/PAT-128.md"
PAT-128.type: methodology
PAT-128.domain: "measurement-design"
PAT-128.maturity: emerging
PAT-128.description: "To measure whether an input variable (description form, phrasing, prompt wording) affects an LLM's recognition/selection decision, place ground-truth probe queries at the recognition boundary (weak-match-to-the-target-candidate); strong-match queries — to candidate or to a sibling — saturate to unanimous decisions and hide the effect (null-by-construction). Validate the instrument with clean controls before trusting any rate; sensitivity is only observable where the decision is marginal."
