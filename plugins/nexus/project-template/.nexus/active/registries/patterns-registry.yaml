# --- PAT-138 ---
PAT-138.name: "check-the-instrument-before-the-reading"
PAT-138.file: "patterns/PAT-138.md"
PAT-138.type: principle
PAT-138.domain: "verification-design"
PAT-138.maturity: emerging
PAT-138.description: "Audit the instrument before acting on its reading. A red test is a claim about TWO artifacts - implementation and harness - and the harness is cheaper to check first (does the fixture carry the condition? does the oracle measure the right thing?). A before/after gate's two figures must come from one identically-written command reproduced verbatim at both sites; prose agreement that both sides use the same convention is exactly what lets them drift, and an under-specified instrument fails toward CLEAN."
PAT-138.use_when:
  - "A test or check returns a failure against work believed correct - before editing the implementation"
  - "Designing or reviewing a gate that compares a BEFORE figure against an AFTER figure"
  - "A verification reports clean or returns ZERO findings - assert the checker consumed rows before trusting the zero"
  - "Reviewing a verification claim where no second independent source exists to compare against"
  - "CAUTION: when multiple independent sources already disagree, compare sources (PAT-097) rather than auditing one"
PAT-138.successes: 0
PAT-138.failures: 0
PAT-138.neutral: 0
PAT-138.effectiveness: 0.60
PAT-138.last_used: ""
