# --- PAT-103 ---
PAT-103.name: "source-fix-over-downstream-bridge"
PAT-103.file: "patterns/PAT-103.md"
PAT-103.type: principle
PAT-103.domain: "protocol-amendment"
PAT-103.maturity: emerging
PAT-103.description: "When an adversarial finding's evidence is 'rule X enumerates A, B, C but not D, and we depend on D inheriting,' surface 'Fix the source rule' as an explicit option in the resolution menu alongside Walk/Fix-downstream/Skip. Source-fix at the canonical surface converts every downstream bridge into a citation; bridge-only at the consumer makes future readers chase inheritance through prose."
PAT-103.use_when:
  - "Adversarial review surfaces 'rule X lists A,B,C but not D' shape findings"
  - "Rule lives at a single canonical location (CLAUDE.md protocol section, registry schema, top-level skill rule table)"
  - "Multiple consumers depend on the same inheritance"
  - "Resolution menus surfaced for adversarial findings — present 'Fix the source rule' as 4th option"
