# --- PAT-098 ---
PAT-098.name: "grep-before-rename"
PAT-098.file: "patterns/PAT-098.md"
PAT-098.type: practice
PAT-098.domain: "refactoring"
PAT-098.maturity: established
PAT-098.description: "Before renaming any cross-referenced identifier, grep all occurrences first to produce a complete reference list, then rename atomically. Transforms possibly-incomplete renames into definitely-complete ones by eliminating memory-based discovery and providing a convergence signal. Recurring-anchor variant fires reliably at NEW-skill-deletion ORIGINAL cut points only — NOT during simplification, deferred-route-cascade, §POST-TYPE amendment, or Validate-phase inline-fix (Sprint 088 empirical: 4/4 deletions fire vs 0/9 non-deletion phases). Dual-form discipline (Sprint 094): search BOTH canonical/prefixed and bare/colloquial token forms — rosters and inventories use bare names that prefixed-only greps miss (canonical-form grep ≠ all-form grep). Generalized (Sprint 095, ISS-202): the grep-as-acceptance-criterion discipline extends beyond rename to ANY N-surface consistency fix — encode cross-surface completeness as an executable predicate (Success Criterion) over the whole file-class, not a manual Files-Affected enumeration; the predicate catches touchpoints enumeration misses (ISS-202 SC-03 surfaced a 3rd contaminated site the plan never listed). Namespace-scoped predicate (Sprint 097, ISS-205): when the target anchor format is also used by OTHER files in the project, raw cross-file grep over-counts (skills own their own section namespaces); correct predicate = audited-file paired tags ∩ external refs only. Fidelity caveat (Sprint 101, ISS-211/212): the grep predicate proves completeness/PRESENCE, NOT equivalence — for delta/duplication work (inlining a canonical block into N variant files), verify fidelity by DIFFING each reproduced block against its canonical source, not presence-grep (presence ≠ equivalence); fidelity standard = faithful semantics in the host file's format, not byte-verbatim. Execution caveat (Sprint 108, ISS-233): a DECLARED vocabulary is a contract — running only a subset of the declared terms and recording a per-class evidence line reads identically to a full run, so record evidence per term × class including zero-hit combinations (declaration ≠ execution, the sibling of presence ≠ equivalence)."
PAT-098.use_when:
  - "Renaming section names, tags, or labels referenced across multiple files"
  - "Renaming markdown or configuration identifiers in multi-file systems"
  - "Refactoring enum values, status labels, or severity levels used across a project"
  - "Any rename where cross-file references could plausibly exist"
  - "Integrity / disconnect cross-greps verifying a deleted identifier is fully unreferenced — search both bare and prefixed forms"
  - "Any N-surface consistency fix (relabel, contract reconciliation, doc cleanup) — define a grep/test acceptance criterion as the completeness check instead of a manual enumerated list"
  - "Verifying fidelity of inlined/duplicated content against a canonical source — diff each reproduced block, don't presence-grep (presence ≠ equivalence)"
  - "Changing a cross-skill field/identifier whose consumers may touch it at runtime or via inheritance without naming the literal token — derive the consumer set by walking the entity lifecycle (producer→finalizer→consumer), not the Files-Affected list"
  - "Running a predicate whose vocabulary was DECLARED as a set (concept + variants + container term) — record evidence per term × class including zero-hit combinations; a per-class-only evidence line cannot reveal that a declared term was never run"
PAT-098.successes: 0
PAT-098.failures: 0
PAT-098.neutral: 0
PAT-098.effectiveness: 1.00
PAT-098.last_used: ""
