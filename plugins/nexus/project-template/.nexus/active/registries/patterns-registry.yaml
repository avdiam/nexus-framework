# --- PAT-135 ---
PAT-135.name: "evidence-artifact-proves-execution-not-adequacy"
PAT-135.file: "patterns/PAT-135.md"
PAT-135.type: principle
PAT-135.domain: "remediation-design"
PAT-135.maturity: emerging
PAT-135.description: "Moving a discipline from 'assert you did it' to 'show what you ran' closes the SKIP hole and opens an ADEQUACY hole — the artifact proves an execution occurred, never that the predicate covered the class, and a well-shaped artifact stops reviewers at its shape. Pair every evidence-artifact requirement with a coverage check on the predicate itself: enumerate name variants, state the glob's breadth, treat a suspiciously low count as a predicate defect, and require a recorded artifact on the not-triggered branch too."
PAT-135.use_when:
  - "Designing a remedy that replaces prose guidance with a required receipt, log, or recorded command"
  - "Authoring gate or checklist items that accept 'evidence' as proof of completion"
  - "Reviewing a compliant-looking artifact whose per-class counts seem low"
  - "Any discipline moving from self-assertion to demonstrated execution"
  - "NOT when the predicate is machine-generated and cannot vary between executions"
PAT-135.successes: 0
PAT-135.failures: 0
PAT-135.neutral: 0
