# --- PAT-105 ---
PAT-105.name: "phase-collapse-on-pre-drafted-canonical-sources"
PAT-105.file: "patterns/PAT-105.md"
PAT-105.type: methodology
PAT-105.domain: "phase-effort-calibration"
PAT-105.maturity: proven
PAT-105.description: "When canonical sources upstream (third-pass synthesis, ratified proposals, prior-pass deliverables) pre-resolve patch text AND design decisions, Analysis collapses to cross-check + delta-compose, Build collapses to patch-application + brief authoring, and Validate Tier 3 cold re-read remains load-bearing. Adversarial review at Build still surfaces ~2 MED findings per C:3 issue outside canonical scope — skipping it under collapse is the dominant failure mode. Compresses 30-50% phase effort without sacrificing adversarial surface."
