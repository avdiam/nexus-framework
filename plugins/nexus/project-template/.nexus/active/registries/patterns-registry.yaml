# --- PAT-141 ---
PAT-141.name: "kill-condition-for-external-contracts"
PAT-141.file: "patterns/PAT-141.md"
PAT-141.type: principle
PAT-141.domain: "dependency-integrity"
PAT-141.maturity: emerging
PAT-141.description: "Attach a verifiable kill condition — a concrete, inspectable statement of what would make the dependency false — alongside every citation of an external tool, skill, library, API, or platform capability, rather than recording the citation alone. A citation asserts existence with no expiry and cannot detect the environment changing underneath it; a kill condition turns silent rot into a check any routine pass can run. Author-side and re-checked at activation, so it protects artifacts that WAIT — which is precisely when execution-time premise verification cannot fire."
PAT-141.use_when:
  - "Authoring an issue, plan, spec, or success criterion whose completion depends on an external tool, skill, library, API, or platform capability"
  - "Activating or scheduling a backlog artifact that names an external capability — before committing a sprint to it"
  - "Recording a dependency as a bare path, tool name, or version string with no statement of what would make it false"
  - "Reviewing an artifact that has waited several cycles and rests on something outside the project's own version control"
  - "CAUTION: not for dependencies inside the project's own repository, where a change is visible in the same diff and the citation cannot silently rot"
PAT-141.successes: 0
PAT-141.failures: 0
PAT-141.neutral: 0
PAT-141.effectiveness: 0.55
PAT-141.last_used: ""
