# --- PAT-109 ---
PAT-109.name: "disconnect-not-delete-guard"
PAT-109.file: "patterns/PAT-109.md"
PAT-109.type: principle
PAT-109.domain: "refactoring-quality"
PAT-109.maturity: established
PAT-109.description: "When wiring a successor (new hook, skill, or method), pair the wire-successor step explicitly with delete-predecessor + scrub-references steps in the same commit. Prevents 'disconnected-but-undeleted' accumulation of dead code, stale doc pointers, orphan permissions, and incorrect architecture descriptions. Sprint 072 → Sprint 084 (12 sprints) evidence: 514 dead lines + 3 stale doc pointers + 2 orphan permissions."
