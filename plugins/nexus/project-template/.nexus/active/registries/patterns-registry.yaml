# --- PAT-144 ---
PAT-144.name: "separate-a-rules-signal-from-its-diagnosis"
PAT-144.file: "patterns/PAT-144.md"
PAT-144.type: principle
PAT-144.domain: "rule-design"
PAT-144.maturity: emerging
PAT-144.description: "Author a threshold rule's mechanical trigger separately from its stated cause, with a classification step between them, so the STOP branch stays sharp for the cause it was written for while every other cause gets a bounded fenced proceed-path. A rule shaped 'if X then STOP because X means Y' decays silently — each override is locally correct, so nothing ever marks the drift."
PAT-144.use_when:
  - "Authoring or reviewing a threshold rule that names a cause — escalation limits, lint severities, alert runbooks, circuit breakers, size caps"
  - "A rule has been overridden more than once and each override was defensible on its own terms"
  - "Writing a STOP condition another person or agent will execute without the author present"
  - "A gate's stated rationale and its actual firing condition are drifting apart"
  - "CAUTION: not for a trigger with exactly one possible cause"
PAT-144.successes: 0
PAT-144.failures: 0
PAT-144.neutral: 0
PAT-144.effectiveness: 0.50
