# --- PAT-133 ---
PAT-133.name: "assert-before-destructive-write"
PAT-133.file: "patterns/PAT-133.md"
PAT-133.type: practice
PAT-133.domain: "data-integrity"
PAT-133.maturity: emerging
PAT-133.description: "Encode completeness invariants as assertions INSIDE the writer so a one-shot bulk overwrite aborts rather than silently emitting a short file that later reads as complete. Prefer two independent arithmetics reaching the same total by different routes — a single count is self-confirming, since the error that dropped a record also lowered the expectation. Inverts write-then-verify for the case where verification-after can only report irreversible damage."
PAT-133.use_when:
  - "A one-shot bulk overwrite where the output's own shape is the only completeness signal"
  - "Generating N records where N was derived from a source rather than given"
  - "Any destructive write whose correctness a human would otherwise have to spot-check to trust"
  - "Consolidating many inputs into a single artifact that later reads as authoritative"
  - "NOT for incremental/append writes, nor for mechanical no-content-delta changes (use PAT-129)"
