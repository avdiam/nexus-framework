# --- PAT-136 ---
PAT-136.name: "extend-the-positioned-mechanism"
PAT-136.file: "patterns/PAT-136.md"
PAT-136.type: principle
PAT-136.domain: "mechanism-design"
PAT-136.maturity: emerging
PAT-136.description: "Before building a new gate, checkpoint, scheduler, or tracked operation, inventory what already runs at the required position or frequency and extend it instead. An existing mandatory mechanism at the right point that merely reports the wrong thing can have its required fields amended, inheriting unskippability for free; an existing pass that already opens the artifact at the right interval can host the new judgment, inheriting the correct clock for free. A new mechanism must earn both from zero and brings its own skip-path."
PAT-136.use_when:
  - "About to add a gate, marker, or enforcement step because a discipline was skipped or produced a wrong result"
  - "About to register a scheduled operation, tracked cadence, or maintenance cycle for recurring hygiene work"
  - "An existing mandatory mechanism sits at the right workflow point but reports a proxy (size, presence, count) instead of the property that matters"
  - "Deciding where a new judgment should live, as distinct from what the judgment should be"
  - "CAUTION: not when the candidate host is drifted, deprecated, or already overloaded - extending inherits its problems too"
PAT-136.successes: 0
PAT-136.failures: 0
PAT-136.neutral: 0
PAT-136.effectiveness: 0.55
PAT-136.last_used: ""
