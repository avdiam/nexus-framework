# --- PAT-140 ---
PAT-140.name: "probe-metric-responsiveness"
PAT-140.file: "patterns/PAT-140.md"
PAT-140.type: principle
PAT-140.domain: "metric-validity"
PAT-140.maturity: emerging
PAT-140.description: "Probe whether a metric can actually respond to the thing it claims to measure before trusting it — apply a known-good improvement to the measured subject and require a delta in the expected DIRECTION, not merely a magnitude. Absence of response is a defect in the instrument, not evidence of stability, and a flat score default-reads as health, which is why insensitivity survives many measurement cycles undetected. Three signatures: no movement under real improvement (insensitive), wrong direction after a correctness fix (weights contradict the spec they implement), or dominance by an age/count/staleness term (measuring elapsed time, not health)."
PAT-140.use_when:
  - "About to report a health score, quality index, or KPI as 'stable' after several cycles of little or no movement"
  - "About to consume a score for a trend line, velocity calibration, or a keep/retire decision"
  - "A genuine correctness fix or known-good remediation just moved a score in the unexpected direction"
  - "Reviewing a scoring formula that claims to implement a documented ladder, rubric, or maturity spec"
  - "CAUTION: not for a metric legitimately saturated at an intended floor/ceiling, and not for doubt about a SINGLE reading — audit that instrument with PAT-138 instead"
PAT-140.successes: 0
PAT-140.failures: 0
PAT-140.neutral: 0
PAT-140.effectiveness: 0.60
PAT-140.last_used: ""
