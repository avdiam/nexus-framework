# --- PAT-134 ---
PAT-134.name: "grep-file-class-for-defect-shape"
PAT-134.file: "patterns/PAT-134.md"
PAT-134.type: practice
PAT-134.domain: "defect-diagnosis"
PAT-134.maturity: emerging
PAT-134.description: "Before designing a fix, grep the whole homogeneous file-class for the defect's structural SHAPE (not its literal text) and ask two questions: where else does this defect live, and does a sibling already implement the correct form? Copy-adapt authorship distributes defects the same way it distributes correctness, so a defect in one member is evidence about the CLASS — and the cure often already sits next to the disease, turning design work into adoption."
PAT-134.use_when:
  - "A defect surfaces in one member of a homogeneous file-class (hooks, skills, templates, agents, handlers)"
  - "Before designing a fix whose blast radius has not been established with an actual command"
  - "When 'is this the only one?' has been answered by reasoning rather than by a grep"
  - "When the correct form of a fix is unclear and inventing one feels necessary"
  - "NOT for genuine singletons, or defects provably specific to one file's unique logic"
PAT-134.successes: 0
PAT-134.failures: 0
PAT-134.neutral: 0
PAT-134.effectiveness: 0.60
