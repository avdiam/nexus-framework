PAT-067.file: "patterns/PAT-067.md"
PAT-067.type: methodology
PAT-067.domain: "quality-assurance"
PAT-067.maturity: established
PAT-067.description: "Execute work mentally before delivery - walk through as if you knew nothing. 60-70% complete = would struggle. Includes adversarial mode for high-confidence outputs: must-find mandate (halt if zero issues), trade-off surfacing, perspective shift from generator to reviewer. Catches gaps and blind spots before users encounter them. Merged E2E integration-simulation (PAT-090, Sprint 105): for 5+ interconnected files, trace 3-6 end-to-end scenarios across file boundaries and enumerate distributed writers."
