  - "Running an A/B over LLM selection/trigger behavior where the delta attributable to form is the quantity of interest"
  - "Any measurement where a null result must be distinguished from a saturated (zero-dynamic-range) instrument"
  - "CAUTION: not for absolute-accuracy measurement — there, representative real queries are correct; boundary probing would distort it"
