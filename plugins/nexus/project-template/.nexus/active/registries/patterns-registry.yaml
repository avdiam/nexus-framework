# --- PAT-139 ---
PAT-139.name: "dogfood-the-mechanism-on-its-own-change"
PAT-139.file: "patterns/PAT-139.md"
PAT-139.type: practice
PAT-139.domain: "mechanism-validation"
PAT-139.maturity: emerging
PAT-139.description: "Run a new check, census, or gate against the very change that authored it - and again against any later change that repairs it. The repair case carries most of the value: whoever amends a mechanism holds its design in mind and therefore feels the least need to search for prior art, making them the person most likely to author a duplicate authority instead of a citation. The authoring change usually meets the mechanism's own trigger, so the test is free."
PAT-139.use_when:
  - "A change authors a new completeness check, census, audit step, or validation mechanism - before calling the work done"
  - "A change amends or repairs an existing mechanism - run the mechanism against the amendment before writing it"
  - "Reviewing a newly-shipped mechanism whose only evidence of correctness is that it was written carefully"
  - "The authoring change itself meets the mechanism's stated trigger conditions"
  - "CAUTION: when the mechanism cannot fire at its own pre-execution call site (the bootstrap case), run it retrospectively and record why, rather than claiming the normal path"
PAT-139.successes: 0
PAT-139.failures: 0
PAT-139.neutral: 0
PAT-139.effectiveness: 0.60
PAT-139.last_used: ""
