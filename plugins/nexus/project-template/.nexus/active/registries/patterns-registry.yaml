# --- PAT-137 ---
PAT-137.name: "check-the-other-writer"
PAT-137.file: "patterns/PAT-137.md"
PAT-137.type: practice
PAT-137.domain: "shared-artifact-integrity"
PAT-137.maturity: emerging
PAT-137.description: "When a change makes a component the second writer to a shared artifact, open every OTHER writer and check what each assumes it owns exclusively - id namespace, sequence, counter, ordering, uniqueness. Fixing the documentation that NAMES the writers feels like completion but changes nothing at runtime: the writer table is a map, and only writers collide. Enumerate writers from source, never from the document you are about to update."
PAT-137.use_when:
  - "A change adds a writer to an artifact that already has one - append-only stores, JSONL logs, registries, sequence files, shared state"
  - "Updating documentation that enumerates the writers of a shared artifact - treat that edit as the signal, not the fix"
  - "A design shows two arrows into the same store, or a write path is duplicated for a new route"
  - "A shared artifact allocates ids, sequences, or counters that downstream pointers resolve through"
  - "CAUTION: skip when writes are serialised through one owner, or the store itself enforces disjoint key spaces"
PAT-137.successes: 0
PAT-137.failures: 0
PAT-137.neutral: 0
PAT-137.effectiveness: 0.55
PAT-137.last_used: ""
