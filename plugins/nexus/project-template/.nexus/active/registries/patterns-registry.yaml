# --- PAT-143 ---
PAT-143.name: "diff-parallel-reports-against-each-other"
PAT-143.file: "patterns/PAT-143.md"
PAT-143.type: practice
PAT-143.domain: "parallel-execution"
PAT-143.maturity: emerging
PAT-143.description: "Require fan-out workers and independent reviewers to report verdicts on SHARED facts, then diff the reports against each other before accepting any of them — per-target conformance is structurally blind to cross-worker disagreement. Resolve every disagreement to a primary source, never to a majority, a confidence level, or seniority, because disagreement means the question is underspecified and both sides may be wrong."
PAT-143.use_when:
  - "Dispatching a batch or sub-agent fan-out where multiple workers touch the same triggers, thresholds, or vocabulary"
  - "Reconciling findings from two or more independent reviewers over one artifact"
  - "Designing the return protocol for a parallel audit — deciding what workers must report, not only what they must do"
  - "A parallel run finished and every individual report passed its own conformance check"
  - "CAUTION: needs shared facts to exist — purely disjoint per-target work has nothing to diff"
PAT-143.successes: 0
PAT-143.failures: 0
PAT-143.neutral: 0
PAT-143.effectiveness: 0.50
