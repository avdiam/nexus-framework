PAT-104.name: "resumption-check-bypass-on-retry"
PAT-104.file: "patterns/PAT-104.md"
PAT-104.type: principle
PAT-104.domain: "trigger-mechanism-design"
PAT-104.maturity: emerging
PAT-104.description: "Trigger mechanisms that (a) log verdicts to a durable audit log used for resumption-detection AND (b) have a Fix-inline retry path on FAIL or CONCERNS must include explicit MANDATORY re-invocation language that bypasses the resumption-check. Both prior FAIL/CONCERNS verdict and post-fix re-run verdict must be preserved in the audit log (not overwritten) for audit-trail integrity. Caught only via Mental Simulation walking post-fix re-entry — table-based review of the trigger spec misses it."
