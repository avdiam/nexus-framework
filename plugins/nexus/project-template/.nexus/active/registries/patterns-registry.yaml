# --- PAT-145 ---
PAT-145.name: "a-deferred-ruling-still-ships-its-consequence"
PAT-145.file: "patterns/PAT-145.md"
PAT-145.type: principle
PAT-145.domain: "decision-hygiene"
PAT-145.maturity: emerging
PAT-145.description: "At every deferral, record two things — what was deferred, and what state is left standing until it is ruled — then apply the cheapest qualifier or pointer that mitigates the second without deciding the first. Deferring a ruling is not deferring its consequence, and the recorded reason makes contradictory shipped state look adjudicated, so later reviews inherit the verdict instead of re-examining it."
PAT-145.use_when:
  - "Recording a deferral, an out-of-scope ruling, or a 'not this issue' routing decision"
  - "Reviewing a finding an earlier phase marked deferred-by-design, at Validate or at closure"
  - "Closing an issue or sprint that carries known-unresolved contradictions"
  - "Two artifacts disagree and the disagreement is about to be recorded as intentional"
  - "CAUTION: does not fire when the standing state is merely incomplete — silence is not contradiction"
PAT-145.successes: 0
