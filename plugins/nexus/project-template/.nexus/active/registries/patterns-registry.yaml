# --- PAT-004 ---
PAT-004.name: "llm-behavioral-programming"
PAT-004.file: "patterns/PAT-004.md"
PAT-004.type: practice
PAT-004.domain: "prompt-engineering"
PAT-004.maturity: established
PAT-004.description: "10 principles for LLM behavioral programming organized in 4 categories: structural (section tags, format-matches-content, procedural chains), guidance (guide reasoning not script execution, imperatives over suggestions, single source then reference), efficiency (tables over prose, preserve what prevents drift), safety (explicit references, inline failure recovery). 5 former principles retired with evidence (emotional anchoring, identity integration, strategic repetition, mantras, template rigidity). Clarity over compression as governing philosophy. Target 40-80% size reduction with improved fresh-instance clarity."
PAT-004.use_when:
  - "Creating new system files or agent definitions"
  - "Refactoring existing prompts for efficiency"
  - "Building behavioral specifications for LLMs"
  - "Optimizing token usage while maintaining functionality"
  - "NOT for human documentation or API specs"
