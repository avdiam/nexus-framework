PAT-127.name: "fan-out-batch-economics"
PAT-127.file: "patterns/PAT-127.md"
PAT-127.type: methodology
PAT-127.domain: "agent-orchestration"
PAT-127.maturity: emerging
PAT-127.description: "Sub-agent/Workflow fan-out cost is dominated by fixed per-spawn overhead (~31K tokens/call), not by per-task size — so before scaling a fan-out, batch many micro-decisions into each agent call rather than spawning one agent per unit. Treats units-per-call as the primary cost lever; amortizes fixed overhead and turns prohibitive corpus sweeps affordable (ISS-217: 88M naive → 4M batched, 6× per-decision)."
