PAT-124.description: "Before relocating or deferring content into a named target (file, section, issue, reference, or future shared home), verify the target both EXISTS and is in a LIVE lifecycle state — not resolved, archived, retired, renamed, wrong-scoped, or not-yet-created — before committing the move. A named target is a hypothesis until verified; deferring into a dead or nonexistent target silently orphans the work, and the loss surfaces only later when someone looks for content that was nominally 'handled.' If the target is a planned new home, the check resolves to 'create-target-first within this plan,' not blind deferral."
