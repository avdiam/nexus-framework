PAT-122.name: "honest-green-all-branches-all-environments"
PAT-122.file: "patterns/PAT-122.md"
PAT-122.type: principle
PAT-122.domain: "testing"
PAT-122.maturity: emerging
PAT-122.description: "Earn 'green' on two axes before claiming it: branch completeness (a test branch that never executed — degrade/error/fail-open paths — is untested even when the suite reports pass) and environment honesty (a green that depends on hand-provisioned dependencies or author-machine tooling is contingent, not real). Force-exercise every branch and re-run in a clean environment; fix the suite or assert the honest fail-open contract rather than re-provisioning to restore green."
